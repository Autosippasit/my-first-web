<script>
    const container = document.getElementById('joystick-container');
const stick = document.getElementById('joystick-stick');

let active = false;
let centerX, centerY;

// เริ่มต้นตำแหน่งกลาง
const updateCenter = () => {
    const rect = container.getBoundingClientRect();
    centerX = rect.left + rect.width / 2;
    centerY = rect.top + rect.height / 2;
};

window.addEventListener('resize', updateCenter);
updateCenter();

const handleMove = (e) => {
    if (!active) return;
    
    // รองรับทั้งเมาส์และนิ้วสัมผัส
    const clientX = e.clientX || (e.touches && e.touches[0].clientX);
    const clientY = e.clientY || (e.touches && e.touches[0].clientY);

    let deltaX = clientX - centerX;
    let deltaY = clientY - centerY;
    
    // จำกัดไม่ให้จอยหลุดออกนอกวงกลมฐาน
    const distance = Math.min(Math.sqrt(deltaX**2 + deltaY**2), 50);
    const angle = Math.atan2(deltaY, deltaX);
    
    const moveX = Math.cos(angle) * distance;
    const moveY = Math.sin(angle) * distance;

    stick.style.transform = `translate(${moveX}px, ${moveY}px)`;
};

const handleStart = () => { active = true; stick.style.cursor = 'grabbing'; };
const handleEnd = () => { 
    active = false; 
    stick.style.transform = 'translate(0, 0)'; // เด้งกลับที่เดิม
    stick.style.cursor = 'grab';
};

// Event Listeners สำหรับเมาส์
container.addEventListener('mousedown', handleStart);
window.addEventListener('mousemove', handleMove);
window.addEventListener('mouseup', handleEnd);

// Event Listeners สำหรับมือถือ (Touch)
container.addEventListener('touchstart', handleStart);
window.addEventListener('touchmove', handleMove);
window.addEventListener('touchend', handleEnd);
async function onConnectClick() {
  try {
    console.log('กำลังค้นหาอุปกรณ์...');
    
    // 1. ขออนุญาตเข้าถึงอุปกรณ์ Bluetooth
    const device = await navigator.bluetooth.requestDevice({
      // acceptAllDevices: true // ใช้บรรทัดนี้ถ้าต้องการหาทุกอย่าง
      // หรือระบุ Filter เฉพาะอุปกรณ์ของคุณ (เช่น หุ่นยนต์ที่สร้างเอง)
      acceptAllDevices: true, 
      optionalServices: ['battery_service'] // ระบุ Service ที่ต้องการคุยด้วย
    });

    // 2. เชื่อมต่อกับ Server (GATT)
    const server = await device.gatt.connect();
    
    // 3. แสดงชื่ออุปกรณ์บนหน้าเว็บ
    document.getElementById('device-name').innerText = device.name;
    
    alert('เชื่อมต่อสำเร็จกับ: ' + device.name);
    
  } catch (error) {
    console.log('การเชื่อมต่อล้มเหลว: ' + error);
    alert('ไม่สามารถเชื่อมต่อได้: ' + error);
  }
}


</script>
